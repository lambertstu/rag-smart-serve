syntax = "proto3";

package data;
option go_package = "./data";

message KnowledgeBase {
  string name = 1;
  string description = 2;
  string embedding_model = 3; // 使用的模型，例如 "embeddinggemma"
  int64 created_at = 4;
  int64 updated_at = 5;
  int64 document_count = 6;
}

message CreateKnowledgeBaseReq {
  string name = 1;
  string description = 2;
  string embedding_model = 3;
}

message CreateKnowledgeBaseResp {
  string id = 1;
}

message ListKnowledgeBasesReq {
  int32 page = 1;
  int32 page_size = 2;
}

message ListKnowledgeBasesResp {
  repeated KnowledgeBase list = 1;
  int64 total = 2;
}

message GetKnowledgeBaseReq {
  string id = 1;
}

message GetKnowledgeBaseResp {
  KnowledgeBase knowledge_base = 1;
}

message UpdateKnowledgeBaseReq {
  string id = 1;
  string name = 2;
  string description = 3;
  string embedding_model = 4;
}

message UpdateKnowledgeBaseResp {
  bool success = 1;
}

message DeleteKnowledgeBaseReq {
  string id = 1;
}

message DeleteKnowledgeBaseResp {
  bool success = 1;
}

// ================= 文档 (Document) =================

message Document {
  string id = 1;
  string knowledge_base_id = 2;
  string file_name = 3;
  string file_type = 4; // pdf, txt, docx, json...
  int64 file_size = 5;
  string status = 6; // pending, processing, indexing, completed, failed
  string error_message = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  int32 chunk_count = 10;
  string content_hash = 11; // 用于去重检测
}

message CreateDocumentReq {
  string knowledge_base_id = 1;
  string file_name = 2;
  string file_type = 3;
  int64 file_size = 4;
  string content_url = 5; // 原始文件存储路径
  string content_hash = 6;
}

message CreateDocumentResp {
  string id = 1;
}

message ListDocumentsReq {
  string knowledge_base_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListDocumentsResp {
  repeated Document list = 1;
  int64 total = 2;
}

message GetDocumentReq {
  string id = 1;
}

message GetDocumentResp {
  Document document = 1;
}

message UpdateDocumentStatusReq {
  string id = 1;
  string status = 2;
  string error_message = 3;
  int32 chunk_count = 4;
}

message UpdateDocumentStatusResp {
  bool success = 1;
}

message DeleteDocumentReq {
  string id = 1;
}

message DeleteDocumentResp {
  bool success = 1;
}

// ================= 分块与向量 (Chunk & Vector) =================
// 对应架构图中的数据准备流程：File -> Chunking -> Embedding -> Vector DB

message Chunk {
  string id = 1;
  string document_id = 2;
  string content = 3; // 文本内容
  int32 chunk_index = 4;
  repeated float embedding = 5; // 向量数据
  map<string, string> metadata = 6; // 额外元数据
}

message SaveChunksReq {
  string document_id = 1;
  repeated Chunk chunks = 2;
}

message SaveChunksResp {
  int32 saved_count = 1;
}

message DeleteChunksReq {
  string document_id = 1; // 删除指定文档的所有 chunks
}

message DeleteChunksResp {
  bool success = 1;
}

service KnowledgeService {
  rpc CreateKnowledgeBase(CreateKnowledgeBaseReq) returns (CreateKnowledgeBaseResp);
  rpc ListKnowledgeBases(ListKnowledgeBasesReq) returns (ListKnowledgeBasesResp);
  rpc GetKnowledgeBase(GetKnowledgeBaseReq) returns (GetKnowledgeBaseResp);
  rpc UpdateKnowledgeBase(UpdateKnowledgeBaseReq) returns (UpdateKnowledgeBaseResp);
  rpc DeleteKnowledgeBase(DeleteKnowledgeBaseReq) returns (DeleteKnowledgeBaseResp);

  rpc CreateDocument(CreateDocumentReq) returns (CreateDocumentResp);
  rpc ListDocuments(ListDocumentsReq) returns (ListDocumentsResp);
  rpc GetDocument(GetDocumentReq) returns (GetDocumentResp);
  rpc UpdateDocumentStatus(UpdateDocumentStatusReq) returns (UpdateDocumentStatusResp);
  rpc DeleteDocument(DeleteDocumentReq) returns (DeleteDocumentResp);

//  rpc SaveChunks(SaveChunksReq) returns (SaveChunksResp);
//  rpc DeleteChunks(DeleteChunksReq) returns (DeleteChunksResp);
}


service AnalyticsService {
}
